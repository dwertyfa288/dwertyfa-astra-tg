[plugin]
id = "dwertyfa-astra-tg"
name = "Telegram for Astra"
version = "0.1.8"
description = "Announce selected Telegram chats with Astra and send voice-dictated replies"
author = "dwertyfa"
license = "MIT"
icon = "icon.svg"

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

# `[capabilities]` is what the daemon may call INTO this plugin.
[capabilities]
actions = true
triggers = true
ui_contributions = true
event_handlers = true

# `[permissions]` is the other direction: which host RPCs the plugin may call
# out to. Default-deny — a manifest with no `[permissions]` section may call
# nothing beyond Register, PluginLog and GetPluginSelfConfig, so declaring a
# capability above is not what lets the matching host call through. This is.
#
# `reason` is shown to the user at install time and is the entire basis of
# their consent. Rewrite these to say what YOUR plugin does with the call, and
# delete any line you do not actually need.
[permissions]
fire_trigger = { reason = "Starts your Telegram announcement command when a selected chat receives a message" }
subscribe_events = { types = ["speech_recognized"], reason = "Reads final recognized phrases only while a Telegram voice-reply window is open" }
