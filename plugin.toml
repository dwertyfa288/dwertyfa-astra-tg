[plugin]
id = "dwertyfa-astra-tg"
name = "TG for Astra"
version = "0.1.21"
description = "Connects by phone number or QR code. Reads messages from selected Telegram chats with Astra's voice and plays voice messages. Lets you reply and message contacts by voice, find recipients by name, send one message to several chats or a Telegram folder, and set up rule-based auto-replies. Announcement templates and reply phrases are customizable. Works without a VPN through the built-in proxy."
author = "dwertyfa"
license = "MIT"
icon = "icon.svg"

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

# `[capabilities]` is what the daemon may call INTO this plugin.
[capabilities]
tools = true
actions = true
triggers = true
ui_contributions = true

# `[permissions]` is the other direction: which host RPCs the plugin may call
# out to. Default-deny — a manifest with no `[permissions]` section may call
# nothing beyond Register, PluginLog and GetPluginSelfConfig, so declaring a
# capability above is not what lets the matching host call through. This is.
#
# `reason` is shown to the user at install time and is the entire basis of
# their consent. Rewrite these to say what YOUR plugin does with the call, and
# delete any line you do not actually need.
[permissions]
fire_trigger = { reason = "Starts your Telegram announcement command when a selected chat receives a message" }
send_chat_message = { reason = "Chooses one of your saved auto-replies when an incoming Telegram message matches multiple rules" }
